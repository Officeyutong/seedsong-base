[package]
name = "seedsong-core"
version.workspace = true
edition.workspace = true
description = "Deterministic DNA music generation and DOB/0–DOB/1 decoding"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "BaseAudioContext"] }

[dev-dependencies]
serde_json.workspace = true

# Independent reference implementations used only by native tests/examples.
# Pin commits so upstream changes require an explicit review.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
spore-dob-0 = { git = "https://github.com/sporeprotocol/spore-dob-0", rev = "a592680c9a507a014ebf505075cbef0b21382799" }
spore-dob-1 = { git = "https://github.com/sporeprotocol/spore-dob-1", rev = "43ad12a24bdee2df9288d772097f6e0ab2fc22fb" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

