[package]
name = "seedsong-core"
version.workspace = true
edition.workspace = true
description = "Deterministic DNA music generation with native and WebAudio backends"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
rand.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "BaseAudioContext"] }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

